{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-dark mb-0">Job Openings & Eligibility Application</h2>
</div>

<div class="row g-4">
    {% for drive in drives %}
    <div class="col-md-6">
        <div class="glass-card p-4 h-100 d-flex flex-column justify-content-between">
            <div>
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h4 class="fw-bold text-primary mb-0">{{ drive.role }}</h4>
                    <span class="badge bg-primary bg-opacity-10 text-primary fs-6 px-3 py-2">
                        ₹{{ drive.package }} LPA
                    </span>
                </div>
                <h6 class="text-secondary fw-semibold mb-3">{{ drive.company_name }}</h6>
            </div>

            <form action="{{ url_for('jobs') }}" method="POST" class="mt-3">
                <input type="hidden" name="job_id" value="{{ drive.job_id }}">
                <div class="input-group">
                    <select name="student_id" class="form-select border-0 bg-white bg-opacity-50" required>
                        <option value="" selected disabled>Select Student to Apply</option>
                        {% for student in students %}
                        <option value="{{ student.student_id }}">{{ student.name }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" class="btn btn-success fw-semibold px-4">Apply</button>
                </div>
            </form>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <div class="glass-card p-5 text-center">
            <h5 class="text-muted mb-0">No active job drives found in the database.</h5>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
