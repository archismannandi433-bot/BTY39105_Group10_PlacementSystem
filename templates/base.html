<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal (G10)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Base CSS & Glass Animations -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Glass Navbar -->
    <nav class="navbar navbar-expand-lg glass-nav-dark sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-light apple-nav-link" href="{{ url_for('dashboard') }}">Placement Portal (G10)</a>
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link text-light fw-medium apple-nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light fw-medium apple-nav-link" href="{{ url_for('students') }}">Students Directory</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light fw-medium apple-nav-link" href="{{ url_for('jobs') }}">Jobs & Applications</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container with Bounce Down Effect -->
    <main class="container py-2 page-bounce-container">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
