<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Placement Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { max-width: 420px; border-radius: 12px; border: none; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">Placement Portal</a>
            <a href="{{ url_for('login') }}" class="btn btn-primary btn-sm">Login</a>
        </div>
    </nav>

    <div class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="card shadow-lg login-card mx-auto p-4">
                    <div class="card-body">
                        <h3 class="fw-bold text-center mb-4">System Login</h3>

                        <form action="{{ url_for('login') }}" method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email or Student Code</label>
                                <input type="text" class="form-control" id="email" name="email" placeholder="Email Address or Student Code" required autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="text-center py-3 text-muted border-top bg-white">
        <small>&copy; Placement Management System. All rights reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
